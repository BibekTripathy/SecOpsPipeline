# Commit Quarantine Gateway configuration.

# Address developers push to. Put TLS in front of this in any real
# deployment: a PAT travels in the Basic auth header.
listen: 127.0.0.1:8080

# Database, quarantine repos, audit log and SARIF reports all live here.
data_dir: ./data

policy_file: ./configs/policy.example.yaml

# Findings this organisation has already accepted. Optional.
baseline_file: ""

# Operational endpoints: /metrics, /healthz, /readyz. Kept off the push
# listener, because /metrics describes your security posture and should
# not be readable by everyone who holds a push token. Empty disables it.
admin_listen: 127.0.0.1:9090

# Reclaim quarantine repositories from held pushes nobody reviews.
hold_expiry: 168h

scan:
  # Concurrent scanner plugins per push.
  workers: 4
  timeout: 5m
  max_push_bytes: 536870912  # 512 MiB
  # Verification tells a live credential from a rotated one, but it sends
  # the matched secret to the provider. Off by default, deliberately.
  verify_secrets: false
  require_signed_commits: false

  # Dockerfile, GitHub Actions, Terraform and Kubernetes checks. Local
  # pattern matching, so it costs essentially nothing.
  iac: true

  dependencies:
    # Off by default: this makes a network call to the OSV API on any
    # push that changes a manifest.
    enabled: false
    # Point at a mirror for an air-gapped deployment.
    endpoint: ""
    timeout: 15s

upstream:
  # The gateway's own deploy key. Developers must NOT have write access to
  # the upstream remote: that is what makes the gateway unbypassable.
  ssh_key_path: ""
  known_hosts_path: ""

# Repositories this gateway fronts. Push to
# https://<listen>/<name>.git and the gateway forwards to url.
repos:
  acme/api:
    url: git@github.com:acme/api.git
    # Optional: this repo's own rules, instead of the global policy.
    # Loaded and validated at startup, so a typo stops the gateway
    # coming up rather than failing one team's push weeks later.
    # policy_file: ./configs/policy.acme-api.yaml
    # baseline_file: ./configs/baseline.acme-api.yaml

log:
  level: info
  format: text
