name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # git is not a convenience here: the gateway shells out to it for
      # every push, and the e2e suite drives a real `git push`.
      - name: configure git
        run: |
          git --version
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race matters: the scanner pool, the hook server, the metrics
      # registry and the in-flight push map are all touched concurrently.
      - name: test
        run: go test -race -count=1 ./...

      - name: coverage
        run: |
          go test -coverprofile=coverage.out ./... >/dev/null
          go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  detection:
    name: detection corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The corpus is the scanner's regression net. A rule change that
      # drops detection, or starts firing on look-alikes, fails here.
      - name: measure detection
        run: |
          REDTEAM_REPORT="$PWD/detection-report.md" \
            go test ./test/redteam -run TestReportFile -count=1 -v
          go test ./test/redteam -count=1 -v

      - uses: actions/upload-artifact@v4
        with:
          name: detection-report
          path: detection-report.md
          retention-days: 30

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tool that reports other people's vulnerable dependencies
      # should not ship with its own.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    # Shared runners are noisy, so these numbers are indicative. They
    # run to catch an order-of-magnitude regression, not to track
    # single-digit percentages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: go test ./test/bench -bench=. -benchmem -run='^$' -count=1 | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.txt
          retention-days: 30
